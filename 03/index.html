
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images and tables</title>
</head>
<body>
    <a href="https://github.com"   >
        <img height="200"   src="https://logos-world.net/wp-content/uploads/2020/11/GitHub-Logo.png" alt="image">
    </a>
    <br>
    <caption>My information</caption>
    <table>

        <tr>
            <th style="border: 3px solid black;">
                name
            </th>
            <th style="border: 3px solid black;">age</th>
            <th style="border: 3px solid black;">address</th>
        </tr>
        <tr>
            <td style="border: 3px solid black;">shaheer</td>
            <td style="border: 3px solid black ;">21</td>
            <td  style="border: 3px solid black;">Lahore</td>
           <tr>
            <td style="border: 3px solid black;">shaheer</td>
            <td style="border: 3px solid black ;">21</td>
            <td style="border: 3px solid black;" >Lahore</td>
         
        </tr>
    </table>
    <h3>ordered list</h3>
    <ol>
        <li type="1">shaheer</li>
        <li type="A">shaheer</li>
        <li type="I">shaheer</li>
    </ol>
    <h3>unordered list</h3>
    <ul>
        <li type="circle">shaheer</li>
        <li type="square">shaheer</li>
        <li type="disc">shaheer</li>
    </ul>

    <h3>Simple Form</h3>
    <form action="/submit" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name "><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="enter your email"><br><br>
        <input type="submit" value="Submit">
    </form>
    
</body>
</html>
